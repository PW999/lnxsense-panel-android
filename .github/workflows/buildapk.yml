name: Build & Release APK
permissions:
  contents: write
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # also allow manual runs

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: ./gradlew assembleRelease
      - run:  mv app/build/outputs/apk/debug/app-debug.apk  "lnxsense-panel-debug-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          files: "lnxsense-panel-debug-${{ github.ref_name }}.apk"
