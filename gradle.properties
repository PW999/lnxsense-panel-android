# Default 512MB heap is insufficient for D8/R8 dexing with Compose dependencies
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Required by all AndroidX/Compose dependencies
android.useAndroidX=true
kotlin.code.style=official
# Prevents R class from including transitive dependency resources, reducing APK size
android.nonTransitiveRClass=true
